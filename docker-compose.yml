# Runs one hub. Set TZ to your time zone if log times matter to you. The panel
# refuses remote management unless MANAGEMENT_PASSWORD is set, and through a
# container port every browser counts as remote.
services:
  token-proxy-router:
    image: ${TPR_IMAGE:-ghcr.io/danielw412/token-proxy-router:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        UPSTREAM_VERSION: ${UPSTREAM_VERSION:-unknown}
        PANEL_VERSION: ${PANEL_VERSION:-unknown}
    container_name: token-proxy-router
    environment:
      TZ: ${TZ:-UTC}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    ports:
      - "127.0.0.1:8317:8317"
      # OAuth callback ports, needed for logging in from a browser on this machine.
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:1455:1455"
    volumes:
      - ${TPR_DATA_PATH:-./tpr-data}:/data
    restart: unless-stopped
