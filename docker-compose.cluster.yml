services:
  token-proxy-router:
    image: ${TPR_IMAGE:-ghcr.io/danielw412/token-proxy-router:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        UPSTREAM_VERSION: ${UPSTREAM_VERSION:-unknown}
        PANEL_VERSION: ${PANEL_VERSION:-unknown}
    container_name: token-proxy-router-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${TPR_DATA_PATH:-./tpr-data}:/data
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec tpr -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
